// ---------- хвост для поиска ----------
// Остальные фильмы со статьёй в ру-вики (~28 тыс.) — без афиш, отдельным tail.json: грузится при первом поиске или
// сразу, если что-то из хвоста уже отмечено. Отмеченное из хвоста переходит в общий каталог — полка, профиль,
// «Оценивать» и «Пересмотреть» видят его как обычное; афишу ему потом докачивает Claude (tools/promote.py).
let tail = [], tailState = null;
function loadTail() {
  if (!tailState) tailState = fetch("tail.json").then(r => r.ok ? r.json() : []).catch(() => []).then(rows => {
    for (const r of rows) {
      if (byId.has(r.id)) continue;
      const it = { id: r.id, sec: "films", kind: "film", title: r.t, orig: r.o || "", year: r.y, country: r.c || "",
        genres: r.g || [], dir: r.d || [], cast: r.a || [], alt: r.alt || [], links: { imdb: r.imdb, kp: r.kp, wiki: r.w }, p: 3, tail: true };
      tail.push(it); byId.set(it.id, it);
    }
    adoptTail();
    marksChanged();   // и полка, и коллекции ачивок считают знаменатели вместе с хвостом
    return tail;
  });
  return tailState;
}
function adoptTail(id) {
  let n = 0;
  for (const k of id ? [id] : marks.keys()) { const it = byId.get(k); if (it && it.tail && !it._in && marks.has(k)) { it._in = true; catalog.push(it); n++; } }
  return n;
}

// ---------- поиск по всему каталогу ----------
// Мимо подбора: найти конкретное название в любом разделе, открыть карточку и проставить всё там.
// Слова запроса ищутся с начала слов («дыра» найдёт «Дыра в земле», «ла» — не «Скала»); знаки препинания
// не мешают («кин дза дза» = «Кин-дза-дза!»).
const sq = (s) => " " + norm(s).replace(/[^\p{L}\p{N}]+/gu, " ").trim() + " ";
// it.alt — другие названия (ярлыки Wikidata): «Дыра в земле» находит фильм, который в прокате «Другой»
const findHay = (it) => it._fh || (it._fh = {
  t: sq(it.title), names: [it.orig, ...(it.alt || [])].filter(Boolean).map(sq), o: sq([it.orig, ...(it.alt || [])].join(" ")),
  all: sq([it.title, it.orig, ...(it.alt || []), it.year, it.end, ...(it.dir || []), ...(it.cre || []), ...(it.cast || [])].join(" ")),
});
let found = [];
function findHits(q) {
  const words = sq(q).trim().split(" ").filter(Boolean);
  if (!words.length) return [];
  const whole = sq(q);
  const out = [];
  for (const it of tail.length ? catalog.concat(tail.filter(t => !t._in)) : catalog) {
    const h = findHay(it);
    if (!words.every(w => h.all.includes(" " + w))) continue;
    // чем ближе к названию, тем выше: совпало целиком → название начинается этими словами («кинг» → «Кинг-Конг»)
    // → начинается с запроса («Кингсглейв») → всё в названии → в оригинале → в людях
    const inT = words.every(w => h.t.includes(" " + w)), inO = words.every(w => h.o.includes(" " + w));
    const score = h.t === whole || h.names.includes(whole) ? 0 : h.t.startsWith(whole) ? 0.5 : h.t.startsWith(whole.trimEnd()) ? 1 : inT ? 2 : inO ? 3 : 4;
    out.push([score, it]);
  }
  // при равной близости к запросу — сначала основной каталог (с афишами), хвост — после
  out.sort((a, b) => a[0] - b[0] || (a[1].tail ? 1 : 0) - (b[1].tail ? 1 : 0) || (a[1].p || 2) - (b[1].p || 2) || b[1].year - a[1].year);
  return out.map(x => x[1]);
}
function hitMark(it) {
  const k = badgeKey(viewOf(it.id));
  if (k === "none") return "";
  const stars = k[0] === "r";
  return `<i class="dot${stars ? " pill" : ""}" data-s="${BADGE[k][0]}" title="${esc(BADGE[k][2])}">${stars ? BADGE[k][1] + "★" : BADGE[k][1]}</i>`;
}
function renderFound() {
  const q = $("fq").value.trim(), box = $("findOut");
  if (!q) { box.innerHTML = `<p>Название по-русски или в оригинале, год, режиссёр, актёр — во всех разделах.</p>`; found = []; return; }
  found = findHits(q);
  if (!found.length) {
    box.innerHTML = `<p>В списках нет «${esc(q)}».</p><button class="send" type="button" data-ask>Попросить добавить «${esc(q)}»</button>`;
    return;
  }
  const shown = found.slice(0, 50);
  box.innerHTML = `<ul class="found">${shown.map(it => `<li><button class="hit" type="button" data-hit="${esc(it.id)}"><span class="pslot"></span><span><span class="t">${esc(it.title)}</span><span class="m">${esc([yearsLabel(it), SECNAME[it.sec], it.orig && it.orig !== it.title ? it.orig : (it.dir || it.cre || [])[0]].filter(Boolean).join(" · "))}</span></span>${hitMark(it)}</button></li>`).join("")}</ul>${found.length > shown.length ? `<div class="find-more">Ещё ${found.length - shown.length} — уточни запрос</div>` : ""}`;
  box.querySelectorAll(".pslot").forEach((slot, i) => slot.replaceWith(posterEl(shown[i])));
}
function openFind() {
  showOverlay("ovFind"); const fq = $("fq"); fq.focus(); fq.select(); renderFound();
  if (!tailState) loadTail().then(() => { if (!$("ovFind").hidden) renderFound(); });   // хвост дочитывается к результатам
}
$("openFind").addEventListener("click", openFind);
let fqT; $("fq").addEventListener("input", () => { clearTimeout(fqT); fqT = setTimeout(renderFound, 120); });
$("fq").addEventListener("keydown", (e) => {
  if (e.key === "Escape") { e.stopPropagation(); hideOverlay("ovFind"); }
  else if (e.key === "Enter") {
    // набрал и сразу Enter — сначала досчитать найденное, а не открыть результат прошлого запроса
    clearTimeout(fqT); renderFound();
    if (found.length) { e.preventDefault(); openDetail(found[0].id, found); }
  }
  else if (e.key === "ArrowDown") { const b = $("findOut").querySelector(".hit"); if (b) { e.preventDefault(); b.focus(); } }
});
$("findOut").addEventListener("keydown", (e) => {
  const b = e.target.closest(".hit"); if (!b || (e.key !== "ArrowDown" && e.key !== "ArrowUp")) return;
  e.preventDefault();
  const li = b.parentElement[e.key === "ArrowDown" ? "nextElementSibling" : "previousElementSibling"];
  if (li) li.querySelector(".hit").focus(); else if (e.key === "ArrowUp") $("fq").focus();
});
$("findSheet").addEventListener("click", (e) => {
  if (e.target.closest(".close")) return hideOverlay("ovFind");
  const hit = e.target.closest("[data-hit]");
  if (hit) return openDetail(hit.dataset.hit, found);
  if (e.target.closest("[data-ask]")) {
    const q = $("fq").value.trim();
    hideOverlay("ovFind"); renderInbox(); $("inText").value = q; showOverlay("ovInbox"); $("inText").focus();
  }
});

// ---------- заявки на добавление ----------
function renderInbox() {
  const sh = $("inboxSheet");
  const keep = sh.querySelector("#inText") ? sh.querySelector("#inText").value : "";
  const secSel = sh.querySelector("#inSec") ? sh.querySelector("#inSec").value : (viewName === "mine" ? mine.sec : "films");
  sh.innerHTML = `<button class="close" type="button" aria-label="Закрыть">✕</button>
    <h2 id="inboxTitle">Добавить названия</h2>
    <p>По одному в строке, можно с годом: «Бойцовский клуб 1999». Claude найдёт афишу, режиссёра и актёров и добавит название в раздел. Для этого напиши ему в чате: «добавь заявки из Списков».</p>
    <textarea id="inText" placeholder="Бойцовский клуб&#10;Кин-дза-дза! 1986" ${store.canWrite ? "" : "disabled"}></textarea>
    <div class="row">
      <div class="sel"><label for="inSec">Раздел</label><select id="inSec">${SECTIONS.map(x => `<option value="${x.key}">${x.name}</option>`).join("")}</select></div>
      <button class="send" type="button" id="inSend" ${store.canWrite ? "" : "disabled"}>Отправить</button>
    </div>
    ${inbox.length ? `<div><p style="margin-bottom:6px">Ждут добавления: ${inbox.length}</p><ul class="pending">${inbox.map(x => `<li><span>${esc(x.text)}<small>${esc(SECNAME[x.sec] || "")}</small></span><button type="button" data-del="${esc(x.id)}" aria-label="Убрать заявку">✕</button></li>`).join("")}</ul></div>` : ""}`;
  sh.querySelector("#inText").value = keep;
  sh.querySelector("#inSec").value = secSel;
}
$("inboxSheet").addEventListener("click", async (e) => {
  if (e.target.closest(".close")) return hideOverlay("ovInbox");
  const del = e.target.closest("[data-del]");
  if (del) {
    const id = del.dataset.del;
    inbox = inbox.filter(x => x.id !== id);
    if (store.mode === "db") { try { await db.doc("inbox/" + id).delete(); } catch { toast("Не получилось убрать заявку"); } }
    else lsSet("spiski.inbox", inbox);
    renderInbox(); return;
  }
  if (e.target.closest("#inSend")) {
    const ta = $("inText"), sec = $("inSec").value;
    const lines = ta.value.split("\n").map(s => s.trim()).filter(Boolean);
    if (!lines.length) return;
    // текст забирается и поле чистится сразу: снимок базы перерисует окно посреди отправки, и в новом поле
    // остались бы уже отправленные строки — следующее «Отправить» их задвоило бы
    ta.value = "";
    $("inSend").disabled = true;
    let ok = 0;
    for (const text of lines) {
      const doc = { text: text.slice(0, 200), sec, t: Date.now() };
      try {
        if (store.mode === "db") { const ref = await db.collection("inbox").add(doc); if (!inbox.some(x => x.id === ref.id)) inbox.push({ id: ref.id, ...doc }); }
        else { inbox.push({ id: "l" + Date.now() + ok, ...doc }); lsSet("spiski.inbox", inbox); }
        ok++;
      } catch {
        toast("Часть заявок не сохранилась");
        if ($("inText")) $("inText").value = lines.slice(ok).join("\n");   // неотправленное — обратно в поле
        break;
      }
    }
    if (ok === lines.length) toast(`Отправлено: ${ok}`);
    renderInbox();
  }
});

// ---------- экраны, оверлеи, клавиши ----------
function setView(name) {
  if (!VIEW_NAME[name]) name = "home";
  viewName = name;
  $("app").dataset.screen = name;   // не data-view: так помечены кнопки перехода, а клик внутри .app искал бы ближайшую
  for (const b of document.querySelectorAll(".vtab")) b.setAttribute("aria-selected", String(b.dataset.view === name));
  $("pTitle").textContent = VIEW_NAME[name];
  $("vHome").hidden = name !== "home";
  $("vDeck").hidden = !MODES[name];
  $("vMine").hidden = name !== "mine";
  if (name === "home") renderHome(); else if (name === "mine") renderMine(); else startDeck(name);
  try { history.replaceState(null, "", "#" + (name === "mine" ? mine.sec : name)); } catch {}
  setY(0);
}
// разделы открываются отовсюду одинаково: вкладки шапки, «‹ Профиль», плитки профиля
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-view]");
  if (b && b.closest("#app")) setView(b.dataset.view);
});
$("openInbox").addEventListener("click", () => { renderInbox(); showOverlay("ovInbox"); });

let renderQueued = false;
function marksChanged() {
  // отметка, которой нет в основном каталоге, — скорее всего из хвоста: дочитать его, чтобы она была на полке
  if (!tailState && catalog.length && ready && [...marks.keys()].some(id => !byId.has(id))) loadTail();
  // хвост уже здесь, а отметки дочитались позже или пришли с другого устройства — тоже на полку (разбор 23.10)
  if (tail.length) adoptTail();
  if (renderQueued || !catalog.length) return;
  renderQueued = true;
  requestAnimationFrame(() => {
    renderQueued = false;
    let n = 0; for (const id of marks.keys()) { const k = badgeKey(viewOf(id)); if (k !== "none" && k !== "no") n++; }
    $("mineCount").textContent = n;
    if (!$("ovFind").hidden) renderFound();   // значки отметок у найденного
    if (detailId) refreshDetailMarks();       // «Вернуть» и отметки с другого устройства — в открытой карточке
    if (!$("ovAch").hidden && achView.startsWith("coll:")) renderAch();   // «видел N из M» — сразу после отметки
    if (viewName === "mine") renderMine(true);
    else if (viewName === "home") renderHome();
    else if (MODES[viewName] && ready && msgKind === "empty") {
      // было пусто, а отметки дошли позже (или пришли с другого устройства) — показать карточку
      if (poolFor(deckMode, deckSec).length) nextCard(); else renderTop();
    }
    else if (MODES[viewName] && ready && $("rcMsg").hidden) {
      // текущее название отметили не кнопками (карточка, другое устройство) — сразу к следующему;
      // карточку, вернувшуюся «Предыдущий», не уводим
      const d = D();
      if (d.cur && !d.touched && !M().inPool(viewOf(d.cur.id)) && $("ovDetail").hidden) { d.history.push({ id: d.cur.id }); nextCard(); }
      else { renderTop(); if (d.cur && $("ovDetail").hidden) renderPanel(); }
    }
  });
}

// у каждого окна — своё «куда вернуть фокус» (окна лежат друг на друге: карточка поверх поиска); пока окно открыто,
// страница под ним недоступна с клавиатуры (inert), Tab не уходит в шапку под подложкой
// сверху — окно, открытое последним (карточка фильма поверх коллекции и коллекция поверх карточки), а не по разметке
let zTop = 50;
const openOverlays = () => [...document.querySelectorAll(".overlay")].filter(o => !o.hidden).sort((a, b) => (+a.style.zIndex || 50) - (+b.style.zIndex || 50));
const topOverlay = () => openOverlays().pop();
function showOverlay(id) {
  const ov = $(id);
  if (ov.hidden) ov._back = document.activeElement;
  ov.style.zIndex = String(++zTop);
  ov.hidden = false; document.body.classList.add("locked"); syncInert();
  const c = ov.querySelector(".close"); c && c.focus({ preventScroll: true });
}
function syncInert() {
  const open = openOverlays(), top = open[open.length - 1];
  for (const el of document.querySelectorAll("header.top, main, footer.foot")) el.inert = open.length > 0;
  for (const o of document.querySelectorAll(".overlay")) o.inert = !o.hidden && o !== top;
}
function hideOverlay(id) {
  const ov = $(id);
  ov.hidden = true; if (id === "ovDetail") detailId = null;
  if ([...document.querySelectorAll(".overlay")].every(o => o.hidden)) document.body.classList.remove("locked");
  syncInert();
  if (ov._back && document.contains(ov._back)) ov._back.focus({ preventScroll: true });
  if (id === "ovDetail" && MODES[viewName] && $("rcMsg").hidden && D().cur) {
    const d = D();
    // отметил в карточке, открытой из режима, — название уходит, но «← Предыдущий» его возвращает
    if (!d.touched && !M().inPool(viewOf(d.cur.id))) { d.history.push({ id: d.cur.id }); nextCard(); } else renderPanel();
  }
  if (id === "ovDetail" && viewName === "home") renderHome();
}
// закрыть по подложке — только если и нажали, и отпустили на ней: выделение текста, отпущенное за краем окна, не закрывает
for (const ov of document.querySelectorAll(".overlay")) {
  ov.addEventListener("pointerdown", (e) => { ov._down = e.target === ov; });
  ov.addEventListener("click", (e) => { if (e.target === ov && ov._down) hideOverlay(ov.id); ov._down = false; });
}

// В режимах цифры — по месту кнопки (своя раскладка у каждого режима), пробел — пропуск, Backspace — «Предыдущий».
// На сообщении вместо карточки Enter — главная кнопка, Esc — вторая.
document.addEventListener("keydown", (e) => {
  if (!(e.target instanceof Element)) return;
  if (e.target.matches("input, textarea, select")) { if (e.key === "Escape") e.target.blur(); return; }
  // окна могут лежать друг на друге (карточка поверх поиска или коллекции): верхнее — открытое последним
  const open = topOverlay();
  if (e.key === "Escape" && open) { hideOverlay(open.id); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (open && open.id === "ovDetail") {
    if (e.key === "ArrowRight" || e.key === "ArrowLeft") { const b = $("detailSheet").querySelector(`[data-nav="${e.key === "ArrowRight" ? 1 : -1}"]`); b && !b.disabled && b.click(); }
    return;
  }
  if (open) return;
  // «/» — и в русской раскладке, где на этой клавише точка
  const slash = e.key === "/" || (e.code === "Slash" && !e.shiftKey);
  if (slash && viewName !== "mine") { e.preventDefault(); openFind(); return; }   // на полке «/» — её собственный поиск
  if (MODES[viewName]) {
    if (!$("rcMsg").hidden) {
      if (e.key === "Enter" && !e.target.closest("button") && msgActions[0]) { e.preventDefault(); msgActions[0].run(); }
      else if (e.key === "Escape" && msgActions[1]) { e.preventDefault(); msgActions[1].run(); }
      return;
    }
    if ($("rc").hidden) return;
    // кнопка, до которой дошли Tab'ом, нажимается пробелом и Enter, как везде, — ответом это не перехватываем
    if ((e.key === " " || e.key === "Enter" || e.key.startsWith("Arrow")) && e.target.closest && e.target.closest("button, a, select") && e.target.matches(":focus-visible")) return;
    const a = M().keymap[e.key] || (e.key === " " ? "skip" : e.key === "Backspace" ? "back" : null);
    if (!a) return;
    e.preventDefault();
    // зажатая клавиша автоповтором не отвечает десяткам названий подряд (Backspace держать можно)
    if (e.repeat && a !== "back") return;
    const b = $("rcPanel").querySelector(`[data-a="${a}"]`);
    if (b && !b.disabled && !b.hidden) answer(a);
  } else if (viewName === "mine" && slash) { e.preventDefault(); $("q").focus(); }
});
window.addEventListener("hashchange", () => {
  const k = location.hash.slice(1);
  if (SECNAME[k]) { mine.sec = k; if (viewName !== "mine") setView("mine"); else renderMine(); }
  else if (VIEW_NAME[k] && k !== viewName) setView(k);
});

let toastT;
// act — кнопка в подсказке («Вернуть»); с ней подсказка держится дольше
function toast(t, act) {
  const el = $("toast");
  el.textContent = t;
  if (act) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "t-act"; b.textContent = act.label;
    b.addEventListener("click", () => { el.hidden = true; clearTimeout(toastT); act.run(); });
    el.append(b);
  }
  // на телефоне в режимах — над панелью ответа, а не поверх «← Предыдущий» и «Не помню»
  const over = MODES[viewName] && $("app").clientWidth <= 760 && !$("rc").hidden;
  el.style.bottom = over ? `calc(${$("rcPanel").offsetHeight + 12}px)` : "";
  el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true; }, act ? 6000 : 2600);
}

// ---------- старт ----------
setDevice(deviceWanted);
renderHome();
fetch("catalog.json").then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(list => {
  catalog = list;
  for (const it of list) byId.set(it.id, it);
  for (const it of list) for (const rid of it.rel || []) {
    if (!byId.has(rid)) continue;
    if (!relOf.has(it.id)) relOf.set(it.id, new Set());
    if (!relOf.has(rid)) relOf.set(rid, new Set());
    relOf.get(it.id).add(rid); relOf.get(rid).add(it.id);
  }
  if (!SECNAME[mine.sec]) mine.sec = "films";
  if (deckSec !== "all" && !SECNAME[deckSec]) deckSec = "all";
  if (deckGenre && !genreList(deckSec).includes(deckGenre)) deckGenre = "";   // жанр из прошлой версии, которого больше нет
  const k = location.hash.slice(1);
  if (SECNAME[k]) { mine.sec = k; setView("mine"); }
  else setView(VIEW_NAME[k] ? k : "home");
  marksChanged();
}).catch(() => {
  $("home").innerHTML = `<div class="h-hero"><h1>Каталог не загрузился</h1><p class="h-lead">Файл каталога не ответил. Обнови страницу; если не поможет — напиши Claude, что «Списки» не открываются.</p></div>`;
});
initStore();
})();
</script>
