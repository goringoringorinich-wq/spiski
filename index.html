<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="description" content="Списки просмотренного: вспомнить, что смотрел, оценить и сравнить с друзьями.">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>Списки просмотренного</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Профиль — точка входа; из него три режима «одно название — одно нажатие» (Вспоминать, Оценивать, Пересмотреть)
   и полка «Моё». Юзерстори — docs/user_stories.md. Одна тёмная тема на любом экране, светлая — только для печати.
   Раскладка зависит от ширины не окна, а блока .app (container queries): так вид телефона можно показать в рамке
   прямо на компьютере — переключатель «компьютер / телефон» в шапке. */
:root {
  color-scheme: dark;
  --bg: #121317;
  --panel: #1a1c21;
  --raise: #23262d;
  --line: #31353e;
  --fg: #ece8e1;
  --muted: #a3a09a;
  --dim: #6f6e6a;
  --accent: #8cc4d6;      /* свечение кинескопа: выбранное, фокус, «почему сейчас», «хочу посмотреть» */
  --accent-ink: #0d1a1f;
  --seen: #b9c2b0;
  --liked: #ef8b70;
  --best: #f1c95f;
  --gone: #5d5f66;
  --bad: #b8807a;         /* 1–2 звезды — приглушённый, чтобы не кричал на полке */
  --shadow: 0 18px 48px rgba(0,0,0,.45);
  --f-display: "Unbounded", "Golos Text", system-ui, sans-serif;
  --f-body: "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-data: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r: 6px;
}
@media print {
  :root { color-scheme: light; --bg: #fff; --panel: #fff; --raise: #f3f2ef; --line: #d8d6d0; --fg: #16171a; --muted: #55545a; --dim: #8a8990; }
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body { background: var(--bg); color: var(--fg); font: 15px/1.45 var(--f-body); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
body.locked { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1480px; margin: 0 auto; }
kbd { font: 500 11px var(--f-data); color: var(--dim); }
.app { container: app / inline-size; min-height: 100vh; display: flex; flex-direction: column; }
.app > main { flex: 1 0 auto; }

/* ---------- вид телефона на компьютере ---------- */
/* Обычно рамки нет (display: contents). В виде телефона .app живёт в «телефоне» 390 × 844: transform делает рамку
   опорой для position: fixed (панель ответов, карточка, тост прижимаются к её краям), а прокручивается .scroller. */
.stage, .device, .scroller { display: contents; }
.devbar { display: none; }
body.phone { overflow: hidden; height: 100vh; background: #0b0c0f; }
body.phone .stage { display: grid; place-items: center; height: 100vh; padding: 64px 16px 16px; }
body.phone .device { display: block; position: relative; width: 390px; height: min(844px, calc(100vh - 80px)); border-radius: 34px; overflow: hidden;
  transform: translateZ(0); background: var(--bg); box-shadow: 0 0 0 10px #050506, 0 0 0 11px #3a3d45, 0 30px 80px rgba(0,0,0,.6); }
body.phone .scroller { display: block; height: 100%; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; }
body.phone .app { min-height: 100%; }
body.phone .scroller::-webkit-scrollbar { display: none; }
body.phone.locked .scroller { overflow: hidden; }
body.phone .devbar { display: flex; position: fixed; top: 14px; left: 50%; translate: -50% 0; z-index: 100; gap: 14px; align-items: center; color: var(--dim); font: 500 12px var(--f-data); white-space: nowrap; }
.seg2 { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--panel); }
.seg2 button { border: 0; background: none; border-radius: 999px; padding: 5px 10px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; font: 500 13px var(--f-body); }
.seg2 button svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; }
.seg2 button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.seg2 button:hover:not([aria-pressed="true"]) { color: var(--fg); }
.hdr-dev button { padding: 5px 8px; }
body.phone .hdr-dev { display: none; }
@media (max-width: 760px), (hover: none) and (pointer: coarse) { .hdr-dev, .devbar { display: none !important; } }   /* и на телефоне боком, и на планшете */

/* ---------- шапка ---------- */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 16px; padding-block: 12px; }
.mark-word { font: 700 19px/1 var(--f-display); letter-spacing: -.01em; white-space: nowrap; border: 0; background: none; padding: 0; }
.views { display: flex; gap: 2px; flex: 1 1 auto; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.views::-webkit-scrollbar { display: none; }
.vtab { border: 0; background: none; padding: 8px 13px; border-radius: 999px; white-space: nowrap; color: var(--muted); font-weight: 600; display: flex; gap: 7px; align-items: baseline; }
.vtab b { font: 500 12px var(--f-data); color: var(--dim); font-variant-numeric: tabular-nums; }
.vtab:hover { color: var(--fg); background: var(--panel); }
.vtab[aria-selected="true"] { background: var(--fg); color: var(--bg); }
.vtab[aria-selected="true"] b { color: color-mix(in srgb, var(--bg) 60%, var(--fg)); }
.back-home, .ptitle { display: none; }
.back-home { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 6px 12px 6px 9px; font-size: 14px; color: var(--muted); align-items: center; gap: 4px; white-space: nowrap; }
.ptitle { font: 700 16px/1.2 var(--f-display); flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.icon-btn { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 7px 13px; white-space: nowrap; font-size: 14px; }
.icon-btn:hover { border-color: var(--muted); }

/* ---------- значки оценок: у каждой своя форма ---------- */
.dot { width: 18px; height: 18px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 11px; line-height: 1; flex: none; font-style: normal; }
.dot[data-s="seen"] { background: var(--seen); color: #1b1d19; }
.dot[data-s="liked"] { background: var(--liked); color: #2a120b; }
.dot[data-s="best"] { background: var(--best); color: #2b2205; }
.dot[data-s="want"] { background: transparent; border: 1.5px solid var(--accent); color: var(--accent); }
.dot[data-s="gone"] { background: transparent; border: 1.5px dashed var(--gone); color: var(--gone); }
.dot[data-s="part"] { background: linear-gradient(90deg, var(--seen) 50%, transparent 50%); border: 1.5px solid var(--seen); color: transparent; }
.dot[data-s="shelf"] { background: transparent; border: 1.5px solid var(--muted); color: var(--fg); }
/* звёзды: 4–5 — тёплый, 3 — нейтральный, 1–2 — приглушённый красный */
.dot[data-s="r5"], .dot[data-s="r4"] { background: var(--liked); color: #2a120b; }
.dot[data-s="r3"] { background: var(--seen); color: #1b1d19; }
.dot[data-s="r2"], .dot[data-s="r1"] { background: var(--bad); color: #24100f; }
.dot.pill { width: auto; min-width: 18px; padding: 0 6px; border-radius: 9px; font: 600 11px/18px var(--f-data); }
.st { color: var(--best); letter-spacing: -.04em; }
.dot[data-s="no"] { background: transparent; border: 1.5px dashed var(--gone); color: var(--gone); }
.dot[data-s="again"] { background: transparent; border: 1.5px solid var(--accent); color: var(--accent); }
.dot[data-s="maybe"] { background: transparent; border: 1.5px dashed var(--accent); color: var(--accent); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: none; border-radius: 999px; padding: 6px 12px 6px 9px; font-size: 14px; color: var(--muted); display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; flex: none; }
.chip b { font: 500 12px var(--f-data); color: var(--dim); font-variant-numeric: tabular-nums; }
.chip:hover { color: var(--fg); border-color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--raise); color: var(--fg); border-color: var(--fg); }
.chip.plain { padding-left: 12px; }

/* ---------- профиль ---------- */
.home { padding-block: 26px 48px; display: flex; flex-direction: column; gap: 30px; }
/* верх профиля (23.10, «сделай покрасивее»): итог — плитками-числами, каждое ведёт на полку с этим фильтром;
   режимы — каждый своим цветом: ✓ — шалфей «видел», ★ — золото, ↻ — голубой, ≡ — коралл; крупный знак режима — фоном */
.h-hero { display: flex; flex-direction: column; gap: 14px; }
.h-hero h1 { margin: 0; font: 700 clamp(28px, 4vw, 44px)/1.05 var(--f-display); letter-spacing: -.02em; }
.h-lead { margin: 0; color: var(--muted); font-size: 17px; max-width: 820px; text-wrap: pretty; }
.h-lead b { color: var(--fg); font-weight: 600; }
.h-stats { display: grid; grid-template-columns: minmax(150px, auto) minmax(0, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; max-width: 900px; }
.h-stat-row { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 1px; background: var(--line); }
.h-stat { display: flex; flex-direction: column; gap: 4px; min-width: 0; padding: 13px 16px 12px; border: 0; background: var(--panel); color: var(--fg); text-align: left; }
.h-stat b { font: 700 26px/1.05 var(--f-display); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.h-stat span { color: var(--muted); font-size: 13px; line-height: 1.25; }
.h-stat.main { background: color-mix(in srgb, var(--accent) 9%, var(--panel)); }
.h-stat.main b { color: var(--accent); }
button.h-stat { transition: background .15s; }
button.h-stat:hover { background: var(--raise); }
.modes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.mode { --tone: var(--accent); position: relative; overflow: hidden; isolation: isolate; text-align: left; color: var(--fg); display: flex; flex-direction: column; align-items: flex-start; gap: 8px;
  min-height: 140px; padding: 18px 18px 16px; border-radius: 16px; border: 1px solid color-mix(in srgb, var(--tone) 26%, var(--line));
  background: radial-gradient(130% 110% at 100% 0%, color-mix(in srgb, var(--tone) 18%, transparent) 0%, transparent 62%), var(--panel);
  transition: border-color .15s, transform .15s; }
.mode:hover { border-color: color-mix(in srgb, var(--tone) 70%, var(--line)); transform: translateY(-1px); }
.mode[data-tone="recall"] { --tone: var(--seen); }
.mode[data-tone="rate"] { --tone: var(--best); }
.mode[data-tone="again"] { --tone: var(--accent); }
.mode[data-tone="mine"] { --tone: var(--liked); }
.mode .m-ico { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font: 700 16px/1 var(--f-body); font-style: normal; background: var(--tone); color: #16171a; flex: none; }
.mode b { font: 700 20px/1.15 var(--f-display); }
.mode small { color: var(--muted); font-size: 14px; line-height: 1.35; max-width: 26ch; }
.mode .m-bg { position: absolute; right: -4px; bottom: -26px; z-index: -1; font: 700 118px/1 var(--f-display); font-style: normal; color: var(--tone); opacity: .08; pointer-events: none; }
.h-block h2 { margin: 0 0 12px; font: 500 12px var(--f-data); text-transform: uppercase; letter-spacing: .08em; color: var(--dim); display: flex; gap: 10px; align-items: baseline; }
.h-block h2 b { color: var(--muted); font-weight: 500; }
.h-block h2 button { margin-left: auto; border: 0; background: none; color: var(--accent); font: 500 13px var(--f-body); text-transform: none; letter-spacing: 0; padding: 8px 0; margin-block: -8px; }
.h-block h2 button:hover { text-decoration: underline; text-underline-offset: 3px; }
.strip-wrap { position: relative; }
.strip-arr { display: none; }
@media (hover: hover) {
  .strip-arr { display: grid; place-items: center; position: absolute; z-index: 2; top: 66px; width: 36px; height: 36px; padding: 0 0 3px; border-radius: 50%;
    border: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 88%, transparent); color: var(--fg); font-size: 22px; line-height: 1;
    box-shadow: 0 4px 14px rgba(0,0,0,.45); opacity: 0; transition: opacity .15s; }
  .strip-arr.l { left: -6px; } .strip-arr.r { right: -6px; }
  .strip-wrap:hover .strip-arr, .strip-arr:focus-visible { opacity: 1; }
  .strip-arr:hover:not(:disabled) { border-color: var(--fg); }
  .strip-wrap:hover .strip-arr:disabled { opacity: .3; cursor: default; }
  .strip-wrap.fits .strip-arr { display: none; }
}
.strip { display: grid; grid-auto-flow: column; grid-auto-columns: 112px; gap: 12px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
.strip::-webkit-scrollbar { display: none; }
.strip > button { border: 0; background: none; padding: 0; text-align: left; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.strip > button:hover .poster { outline: 2px solid var(--fg); outline-offset: 2px; }
.strip .t { font-size: 13px; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: break-word; hyphens: auto; }
.strip-empty { color: var(--dim); font-size: 14px; }
.h-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.h-card { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); padding: 16px 16px 14px; min-width: 0; }
.bars { display: flex; flex-direction: column; gap: 7px; margin: 0; padding: 0; list-style: none; }
/* подпись | дорожка | число: у числа колонка постоянной ширины — дорожки всех строк равны, длины сравнимы
   (раньше дорожка зависела от ширины числа, и полоски разных строк нельзя было сравнить) */
.bars li { display: grid; grid-template-columns: minmax(80px, 48%) minmax(0, 1fr) 4ch; gap: 10px; align-items: center; font-size: 14px; }
.bars .lbl { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bars .tr { height: 8px; background: var(--raise); border-radius: 4px; overflow: hidden; }
.bars .tr i { display: block; height: 100%; border-radius: 4px; background: var(--accent); }
.bars .tr i.gold { background: var(--best); }
.bars .tr i.warm { background: var(--liked); }
.bars .tr i.cool { background: var(--seen); }
.bars .tr i.low { background: var(--bad); }
.bars .tr i.none { background: var(--dim); }
.bars .n { font: 500 13px var(--f-data); color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
/* столбцы: общая шкала от нуля, равная ширина, число над своим столбцом; у столбца бывает две части (5★ = любимое + 5★) */
.cols { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 4px; height: 170px; }
.cols > div { display: grid; grid-template-rows: minmax(0, 1fr) auto; min-width: 0; }
.cols .bar { position: relative; }
.cols .bar i { position: absolute; left: 14%; right: 14%; background: var(--seen); }
.cols .bar i:first-child { border-radius: 0; }
.cols .bar i:last-of-type { border-radius: 3px 3px 0 0; }
.cols .bar i.gold { background: var(--best); }
.cols .bar b { position: absolute; left: -4px; right: -4px; text-align: center; font: 500 12px var(--f-data); color: var(--muted); font-variant-numeric: tabular-nums; }
.cols .k { text-align: center; font: 500 11px var(--f-data); color: var(--dim); padding-top: 6px; border-top: 1px solid var(--line); white-space: nowrap; overflow: hidden; }
.h-legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 12px 0 0; padding: 0; list-style: none; color: var(--muted); font-size: 13px; }
.h-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; background: var(--seen); }
.h-legend i.gold { background: var(--best); }
.h-legend b { color: var(--fg); font-weight: 600; }
/* разделы — просто числа: полоска «фильмы 947 против аниме 33» ничего не добавляет к самим числам */
.stat4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
.stat4 div { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; background: var(--bg); }
.stat4 b { display: block; font: 700 26px/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.stat4 span { color: var(--muted); font-size: 13px; }
.h-wide { grid-column: span 2; }
.h-full { grid-column: 1 / -1; }

/* ---------- ачивки ---------- */
/* медаль — ступень, до которой дошёл: бронза, серебро, золото (последняя ступень); серая — ещё ни одной */
.ach-home .h-card { display: flex; flex-direction: column; gap: 14px; }
.ms-head { font-size: 15px; color: var(--muted); }
.ms-head b { color: var(--fg); font: 700 22px/1 var(--f-display); margin-right: 2px; }
.ms { --p: 0; list-style: none; margin: 0; padding: 0; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 4px; align-items: start; }
.ms li { display: flex; flex-direction: column; align-items: center; gap: 6px; position: relative; text-align: center; min-width: 0; }
.ms li::before { content: ""; position: absolute; top: 15px; left: -50%; right: 50%; height: 2px; background: var(--line); z-index: 0; }
.ms li:first-child::before { display: none; }
.ms li.ms-on::before { background: var(--best); }
.ms li.ms-next::before { background: linear-gradient(90deg, var(--best) calc(var(--p) * 1%), var(--line) 0); }
.ms .dot2 { position: relative; z-index: 1; min-width: 32px; height: 32px; padding: 0 6px; border-radius: 16px; display: grid; place-items: center; font: 600 12px var(--f-data);
  border: 1.5px solid var(--line); background: var(--panel); color: var(--dim); white-space: nowrap; }
.ms li.ms-on .dot2 { background: var(--best); border-color: var(--best); color: #2b2205; }
.ms li.ms-next .dot2 { border-color: var(--best); color: var(--fg); }
.ms small { font-size: 12px; line-height: 1.2; color: var(--muted); overflow-wrap: break-word; hyphens: auto; }
.ms li.ms-on small { color: var(--fg); }
.ms-why { margin: 0; color: var(--dim); font-size: 13px; }
.ach-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
.ach { position: relative; display: flex; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 10px; padding: 10px 36px 10px 12px; background: var(--bg); min-width: 0; }
.ach .medal { flex: none; min-width: 42px; height: 42px; padding: 0 6px; border-radius: 21px; display: grid; place-items: center; font: 700 13px var(--f-data);
  border: 2px solid var(--line); color: var(--dim); background: var(--panel); }
.ach[data-tone="bronze"] .medal { border-color: #b98a5e; color: #e5c3a1; background: color-mix(in srgb, #b98a5e 22%, var(--panel)); }
.ach[data-tone="silver"] .medal { border-color: #b8c0cb; color: #eef1f5; background: color-mix(in srgb, #b8c0cb 22%, var(--panel)); }
.ach[data-tone="gold"] .medal { border-color: var(--best); color: #2b2205; background: var(--best); }
.ach[data-tone="none"] { opacity: .6; }
.ach-t { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1; }
.ach-t b { font-weight: 600; font-size: 14px; line-height: 1.25; overflow: hidden; overflow-wrap: break-word; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.ach-t small { color: var(--muted); font: 500 12px var(--f-data); }
.bar { display: block; height: 4px; border-radius: 2px; background: var(--raise); overflow: hidden; font-style: normal; }
.bar > i { display: block; height: 100%; border-radius: 2px; background: var(--best); }
.bar.big { height: 8px; border-radius: 4px; }
.coll-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.coll { position: relative; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); min-width: 0; transition: border-color .15s; }
.coll:hover { border-color: var(--muted); }
.coll-open { display: flex; flex-direction: column; gap: 6px; width: 100%; height: 100%; border: 0; background: none; color: var(--fg); text-align: left; padding: 11px 12px 12px; border-radius: 10px; }
.coll-name { font-weight: 600; line-height: 1.25; padding-right: 26px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.coll-k { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-top: auto; }
.coll-k small { color: var(--dim); font-size: 12px; }
.coll-p { color: var(--muted); font: 500 13px var(--f-data); white-space: nowrap; }
.coll-p b { color: var(--fg); }
.coll.done { border-color: color-mix(in srgb, var(--best) 55%, var(--line)); }
/* звезда подписки — в углу карточки ступени или коллекции; подписанное обведено золотом */
.sub-star { position: absolute; top: 5px; right: 5px; z-index: 2; width: 32px; height: 32px; border: 0; border-radius: 50%; background: none; padding: 0;
  display: grid; place-items: center; font-size: 18px; line-height: 1; color: var(--dim); transition: color .12s, background .12s; }
.sub-star:hover { color: var(--best); background: var(--raise); }
.sub-star[aria-pressed="true"] { color: var(--best); }
.coll.sub, .ach.sub { border-color: color-mix(in srgb, var(--best) 45%, var(--line)); }
.sub-flag[aria-pressed="true"] { color: var(--best); }
.person { border: 0; background: none; padding: 0; color: inherit; font: inherit; text-align: left; text-decoration: underline dotted color-mix(in srgb, currentColor 45%, transparent); text-underline-offset: 3px; }
.person:hover { color: var(--accent); text-decoration-color: currentColor; }
.ach-sheet { width: min(900px, 100%); padding: 24px 26px 28px; display: flex; flex-direction: column; gap: 14px; }
.ach-sheet h2 { margin: 0; font: 700 24px var(--f-display); padding-right: 44px; }
.ach-sheet h3 { margin: 10px 0 10px; font: 500 12px var(--f-data); text-transform: uppercase; letter-spacing: .08em; color: var(--dim); }
.ach-sheet h4 { margin: 14px 0 8px; font-size: 14px; color: var(--muted); font-weight: 600; }
.ach-sheet section { display: flex; flex-direction: column; }
.ach-sheet .search { max-width: 420px; margin-bottom: 10px; flex: none; }   /* в колонке flex-basis 300px давал поиску 300px высоты */
.sub-grid { align-items: stretch; }
.ms.full { gap: 6px; }
.ach-back { align-self: flex-start; border: 0; background: none; color: var(--accent); padding: 4px 0; font-size: 14px; }
.coll-meta { margin: -4px 0 0; color: var(--muted); }
.coll-meta b { color: var(--fg); }
.ach-sheet > .flag { align-self: flex-start; }
.coll-items { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 16px 12px; margin-top: 6px; }
.ci { border: 0; background: none; padding: 0; text-align: left; display: flex; flex-direction: column; gap: 5px; min-width: 0; color: var(--fg); }
.ci .t { font-size: 13px; font-weight: 600; line-height: 1.25; overflow-wrap: break-word; hyphens: auto; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ci .y { font: 400 12px var(--f-data); color: var(--muted); margin-top: -2px; }
/* не виденное — приглушено, виденное — как на полке */
.ci:not(.on) .poster { filter: grayscale(.85) brightness(.55); }
.ci:not(.on) .t { color: var(--muted); }
.ci:hover .poster { outline: 2px solid var(--fg); outline-offset: 2px; filter: none; }
/* сравнить с другом: свой ключ — крупно и копируется одним нажатием; чужой — поле и «Сравнить» */
.cmp-home { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px 28px; align-items: center; }
.cmp-mine, .cmp-theirs { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; min-width: 0; }
.cmp-home .lbl { font: 500 11px var(--f-data); text-transform: uppercase; letter-spacing: .08em; color: var(--dim); width: 100%; }
.key-out { font: 700 22px var(--f-data); letter-spacing: .08em; width: 12ch; field-sizing: content; min-width: 9ch; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: var(--r); padding: 6px 10px; }
.sync-out { font-size: 15px; letter-spacing: .03em; width: 100%; max-width: 34ch; field-sizing: fixed; }
.key-long { width: 100%; font: 400 12px/1.35 var(--f-data); background: var(--bg); color: var(--muted); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; resize: none; word-break: break-all; }
#keyIn, #syncIn { font: 600 16px var(--f-data); letter-spacing: .06em; text-transform: uppercase; width: 12ch; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: var(--r); padding: 9px 10px; }
/* код синхронизации и длинный ключ — длинные и с регистром: поле растёт, буквы как есть (16px — iPhone не увеличивает страницу) */
#syncIn, #keyIn.key-in-long { flex: 1 1 16ch; width: auto; min-width: 0; max-width: 34ch; text-transform: none; letter-spacing: .03em; }
#keyIn::placeholder, #syncIn::placeholder { color: var(--dim); font-weight: 500; }
.cmp-home .send { border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 600; border-radius: var(--r); padding: 10px 18px; }
.cmp-mine small { color: var(--muted); width: 100%; }
.cmp-note { grid-column: 1 / -1; margin: 0; color: var(--dim); font-size: 13px; }
/* «Отключить» нужно редко — тихой ссылкой под пояснением, а не второй кнопкой рядом с кодом */
.flag.sync-off { grid-column: 1 / -1; justify-self: start; margin-top: -8px; border-color: transparent; padding-inline: 0; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line); }
.flag.sync-off:hover:not(:disabled) { border-color: transparent; text-decoration-color: currentColor; }
.cmp-stats { margin: 4px 0 6px; }
/* перенос коллекции файлом: две кнопки; прочитанный файл — что изменится и «Загрузить» */
.file-home { display: flex; flex-direction: column; gap: 12px; }
.file-acts, .file-offer { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.file-offer p, .file-status { margin: 0; width: 100%; }
.file-status { color: var(--muted); }
.file-home .send { border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 600; border-radius: var(--r); padding: 10px 18px; }
.ach-sheet h3 b { color: var(--muted); font-weight: 500; }

/* ---------- режимы: одно название, одно нажатие ---------- */
.rc-top { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; padding-block: 20px 16px; }
/* жанр — такой же «чип», только раскрывающийся список; выбран — подсвечен, как нажатый раздел */
.gsel { flex: none; display: inline-flex; align-items: center; gap: 14px; }
.gsel::before { content: ""; width: 1px; height: 22px; background: var(--line); }
.gsel select { appearance: none; field-sizing: content; border: 1px solid var(--line); border-radius: 999px; padding: 6px 30px 6px 12px; font-size: 14px; color: var(--muted); cursor: pointer;
  background: none; background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: calc(100% - 16px) 54%, calc(100% - 11px) 54%; background-size: 5px 5px; background-repeat: no-repeat; }
.gsel select:hover { color: var(--fg); border-color: var(--muted); }
.gsel.on select { background-color: var(--raise); color: var(--fg); border-color: var(--fg); }
.gsel option { background: var(--panel); color: var(--fg); }
.gsel.rc-secsel { display: none; }   /* раздел списком — только в телефонной вёрстке, на широком экране кнопки */
/* Три колонки: афиша, панель ответа, описание. Высота афиши — по экрану, чтобы кнопки всегда были видны. */
.rc { --ph: clamp(300px, calc(100dvh - 200px), 480px); --pw: calc(var(--ph) * 2 / 3);
  display: grid; grid-template-columns: var(--pw) 400px minmax(0, 1fr); gap: 28px; padding-block: 4px 40px; align-items: start; }
.rc-col { display: flex; flex-direction: column; gap: 8px; width: var(--pw); max-width: 100%; }
.rc-poster { display: block; width: var(--pw); height: var(--ph); max-width: 100%; margin: 0 auto; border: 0; padding: 0; background: var(--panel); border-radius: 8px; overflow: hidden; position: relative; box-shadow: 0 12px 34px rgba(0,0,0,.45); }
.rc-poster .poster { width: 100%; height: 100%; aspect-ratio: auto; border-radius: 0; }
.rc-poster .ph b { font-size: max(8px, min(22px, calc(78cqi / var(--fit, 6)))); }
.rc-panel { display: flex; flex-direction: column; gap: 10px; }
.ans { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.ans.c3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.ans.c5 { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.ans .wide { grid-column: 1 / -1; }
.opt { position: relative; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; min-height: 84px; padding: 8px 6px;
  display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 600; font-size: 17px; line-height: 1.15; color: var(--fg);
  text-align: center; min-width: 0; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.opt.sub { min-height: 58px; font-size: 15px; color: var(--muted); }
.opt.col { flex-direction: column; gap: 7px; font-size: 15px; }
.opt .dot { width: 22px; height: 22px; font-size: 13px; }
.opt kbd { position: absolute; top: 5px; right: 8px; }
.opt:hover { border-color: var(--muted); color: var(--fg); }
.opt[data-a="want"]:hover, .opt[data-a="maybe"]:hover { border-color: var(--accent); }
.opt[data-a="best"]:hover { border-color: var(--best); }
.opt.rs { flex-direction: column; gap: 4px; padding-inline: 2px; }
.opt.rs b { font: 700 20px/1 var(--f-display); white-space: nowrap; }
.opt.rs b span { color: var(--best); font-size: .85em; }
.opt.rs small { font-size: 12px; font-weight: 500; color: var(--muted); }
.opt.rs[data-a="r1"]:hover, .opt.rs[data-a="r2"]:hover { border-color: var(--bad); }
.opt.rs[data-a="r4"]:hover, .opt.rs[data-a="r5"]:hover { border-color: var(--liked); }
.opt:active { transform: translateY(1px); }
.opt[aria-pressed="true"] { color: var(--fg); background: color-mix(in srgb, var(--accent) 16%, var(--panel)); border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.opt:disabled { opacity: .4; cursor: default; }
.next { border: 0; border-radius: 8px; min-height: 52px; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 10px; touch-action: manipulation; padding: 0 20px; }
.next:hover:not(:disabled) { filter: brightness(1.08); }
.next:disabled { background: var(--raise); color: var(--dim); cursor: default; }
.next kbd { color: inherit; opacity: .65; }
.act-minor { display: flex; gap: 4px; }
.act-minor button { flex: 1 1 0; min-width: 0; white-space: nowrap; border: 0; background: none; color: var(--muted); padding: 9px 4px; font-size: 13px; border-radius: var(--r);
  display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 44px; justify-content: center; }
.act-minor button[hidden] { display: none; }
.act-minor button:hover:not(:disabled) { background: var(--raise); color: var(--fg); }
.act-minor button:disabled { opacity: .35; cursor: default; }
/* «← Предыдущий» — исправить промах: видно, какое название и какой ответ вернутся */
.act-minor .prev { position: relative; flex: 2.2 1 0; align-items: flex-start; text-align: left; padding: 6px 30px 6px 12px; border: 1px solid var(--line); color: var(--fg); }
.act-minor .prev b { font-weight: 600; }
.act-minor .prev small { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; color: var(--muted); }
.act-minor .prev small:empty { visibility: hidden; }
.act-minor .prev small:empty::before { content: "\00a0"; }
.act-minor .prev kbd { position: absolute; top: 6px; right: 9px; }
.act-minor .prev:hover:not(:disabled) { border-color: var(--muted); }
.rc-last { font-size: 13px; color: var(--dim); min-height: 1.45em; overflow-wrap: anywhere; }
.rc-last b { color: var(--muted); font-weight: 500; }
.rc-info { min-width: 0; display: flex; flex-direction: column; gap: 14px; padding-top: 2px; max-width: 680px; }
.rc-mtitle { display: none; font: 700 18px/1.2 var(--f-display); text-align: center; text-wrap: balance; overflow-wrap: anywhere; }
.rc-mtitle span { font: 500 13px var(--f-data); color: var(--muted); margin-left: 6px; }
.rc-mtitle small { display: block; margin-top: 3px; font: 500 14px/1.25 var(--f-body); color: var(--muted); }
.rc-sec { font: 500 11px var(--f-data); color: var(--dim); text-transform: uppercase; letter-spacing: .08em; }
/* сообщение вместо карточки: «загружаю», «всё отмечено» — кнопки тоже в одно нажатие */
.rc-msg { padding-block: 36px 80px; max-width: 760px; }
.rc-msg h2 { margin: 0 0 10px; font: 700 clamp(21px, 2.6vw, 28px)/1.2 var(--f-display); text-wrap: balance; }
.rc-msg p { margin: 0 0 20px; color: var(--muted); font-size: 16px; max-width: 620px; }
.msg-acts { display: flex; flex-wrap: wrap; gap: 10px; max-width: 620px; }
.msg-acts .next { flex: 1 1 240px; }
.msg-acts .sec-btn { flex: 1 1 200px; min-height: 52px; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 0 20px; color: var(--fg); font-weight: 600; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 10px; }
.msg-acts .sec-btn:hover { border-color: var(--muted); }
.msg-acts .sec-btn kbd { opacity: .8; }

/* ---------- общие куски карточки ---------- */
.d-title { margin: 0; font: 700 clamp(22px, 3vw, 34px)/1.1 var(--f-display); letter-spacing: -.015em; text-wrap: balance; overflow-wrap: anywhere; }
.d-orig { color: var(--muted); margin-top: -8px; overflow-wrap: anywhere; }
.d-meta { font: 400 13px var(--f-data); color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 14px; }
.d-genres { display: flex; flex-wrap: wrap; gap: 6px; }
.d-genres span, .d-genres button { border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: 13px; color: var(--muted); background: none; }
.d-genres button:hover { color: var(--fg); border-color: var(--muted); }
.d-genres button[aria-pressed="true"] { background: var(--raise); color: var(--fg); border-color: var(--fg); }
.facts { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; }
.facts dt { font: 500 11px/1.9 var(--f-data); text-transform: uppercase; letter-spacing: .06em; color: var(--dim); }
.facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.links { display: flex; flex-wrap: wrap; gap: 8px 12px; }
.links a { color: var(--accent); text-decoration: none; border-bottom: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); font-size: 14px; }
.links a:hover { border-color: var(--accent); }

.poster { position: relative; display: block; aspect-ratio: 2 / 3; max-width: 100%; border-radius: var(--r); overflow: hidden; background: var(--panel); container-type: inline-size; }
.poster img { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; object-fit: cover; display: block; }
.ph { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 10cqi; background: var(--ph, var(--raise)); }
/* заглушка без афиши: шрифт от ширины самой афиши — в узкой карточке телефона слово целиком влезает в строку,
   а не рвётся посреди («Горнич|ая»); переносы по слогам — где браузер их умеет. --fit — ширина самого длинного
   слова в em: кегль не крупнее, чем нужно, чтобы оно встало в строку целиком («государственнос|ти» на большой
   афише, 23.10); но не мельче 8px — в узкой ленте очень длинное слово всё же перенесётся */
.ph b { font: 700 clamp(9px, 10cqi, 22px)/1.15 var(--f-display); font-size: max(8px, min(clamp(9px, 10cqi, 22px), calc(78cqi / var(--fit, 6))));
  color: rgba(255,255,255,.88); text-wrap: balance; overflow-wrap: break-word; hyphens: auto; }
.ph i { font: 500 12px var(--f-data); font-style: normal; color: rgba(255,255,255,.6); }

/* звёзды в карточке: наведение показывает, сколько будет */
.stars { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; }
.star { border: 0; background: none; width: 38px; height: 40px; padding: 0; font-size: 28px; line-height: 1; color: var(--line); border-radius: 6px;
  touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.star[aria-pressed="true"] { color: var(--best); }
.star:disabled { cursor: default; }
@media (hover: hover) {
  .stars:hover .star:not(:disabled) { color: color-mix(in srgb, var(--best) 75%, var(--line)); }
  .stars .star:hover ~ .star:not(:disabled) { color: var(--line); }
}
.slabel { margin-left: 8px; font-size: 13px; color: var(--muted); white-space: nowrap; }
.flags { display: flex; flex-wrap: wrap; gap: 6px; }
.flag { border: 1px solid var(--line); background: none; border-radius: 999px; padding: 5px 12px; min-height: 34px; font-size: 13px; color: var(--muted); white-space: nowrap; touch-action: manipulation; }
.flag:hover:not(:disabled) { color: var(--fg); border-color: var(--muted); }
.flag[aria-pressed="true"] { color: var(--fg); border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
.flag[data-mark="best"][aria-pressed="true"] { border-color: var(--best); background: color-mix(in srgb, var(--best) 16%, transparent); }
.flag:disabled { opacity: .5; cursor: default; }

/* ---------- Моё ---------- */
.summary { display: flex; flex-wrap: wrap; gap: 10px 28px; align-items: baseline; justify-content: space-between; padding-block: 24px 12px; }
.summary h1 { margin: 0; font: 700 clamp(26px, 4.2vw, 44px)/1.05 var(--f-display); letter-spacing: -.02em; }
.sectabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; }
.sectabs::-webkit-scrollbar { display: none; }
.tab { border: 0; background: none; padding: 8px 12px; border-radius: 999px; white-space: nowrap; color: var(--muted); font-weight: 500; display: flex; gap: 7px; align-items: baseline; }
.tab b { font: 500 12px var(--f-data); color: var(--dim); font-variant-numeric: tabular-nums; }
.tab:hover { color: var(--fg); background: var(--panel); }
.tab[aria-selected="true"] { background: var(--raise); color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); }
.filters { display: flex; flex-direction: column; gap: 12px; padding-block: 12px 18px; border-bottom: 1px solid var(--line); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
.search { position: relative; flex: 0 1 300px; min-width: 0; }
.search input { width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px 8px 34px; }
.search input::placeholder { color: var(--dim); }
.search svg { position: absolute; left: 12px; top: 50%; translate: 0 -50%; width: 15px; height: 15px; stroke: var(--dim); fill: none; stroke-width: 2; }
.sel { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.sel label { font: 500 11px var(--f-data); color: var(--dim); text-transform: uppercase; letter-spacing: .06em; }
.sel select { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 7px 28px 7px 10px; max-width: 220px; appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 14px) 52%, calc(100% - 9px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
.reset { border: 0; background: none; color: var(--accent); padding: 6px 4px; font-size: 14px; }
.decades { display: grid; grid-auto-flow: column; grid-auto-columns: 54px; justify-content: start; gap: 4px; overflow-x: auto; padding-bottom: 2px; }
.dec { border: 0; background: none; padding: 0; display: flex; flex-direction: column; gap: 5px; align-items: stretch; color: var(--muted); }
.dec .bar { height: 40px; display: flex; flex-direction: column; justify-content: flex-end; border-bottom: 1px solid var(--line); }
.dec .bar i { display: block; background: var(--raise); border-radius: 3px 3px 0 0; min-height: 2px; }
.dec span { font: 500 11px var(--f-data); text-align: center; white-space: nowrap; }
.dec:hover span { color: var(--fg); }
.dec[aria-pressed="true"] .bar i { background: var(--accent); }
.dec[aria-pressed="true"] span { color: var(--fg); }
.dec:disabled { opacity: .35; cursor: default; }
.more-filters { display: flex; flex-direction: column; gap: 12px; }
.toggle-filters { display: none; align-self: flex-start; }
.grid-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-block: 16px 12px; color: var(--muted); font-size: 14px; flex-wrap: wrap; }
.grid-head h2 { margin: 0; font: 600 15px var(--f-body); color: var(--fg); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 22px 16px; padding-bottom: 40px; }
.card { position: relative; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.card .open { border: 0; background: none; padding: 0; text-align: left; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.card .badge { position: absolute; z-index: 2; top: 8px; right: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.5); }
.card .t { font-weight: 600; font-size: 14px; line-height: 1.25; overflow-wrap: break-word; hyphens: auto; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.card .y { font: 400 12px var(--f-data); color: var(--muted); margin-top: -4px; overflow-wrap: anywhere; }
.card[data-s="gone"] .poster { filter: grayscale(1) brightness(.6); }
.card .open:hover .poster { outline: 2px solid var(--fg); outline-offset: 2px; }
.quick { position: absolute; z-index: 3; left: 6px; right: 6px; top: 6px; display: flex; gap: 0; opacity: 0; transition: opacity .15s; pointer-events: none; background: rgba(14,15,18,.86); backdrop-filter: blur(4px); border-radius: 4px; }
.card:hover .quick, .card:has(:focus-visible) .quick { opacity: 1; pointer-events: auto; }
.quick button { flex: 1; min-width: 0; border: 0; background: none; border-radius: 4px; padding: 5px 0; font-size: 15px; line-height: 1; color: #5a5d66; }
.quick button[data-q="no"] { color: var(--fg); font-size: 14px; }
.quick button[data-q="no"]:hover { background: var(--fg); color: var(--bg); }
.quick button[data-q="no"][data-on="true"] { box-shadow: inset 0 -2px 0 var(--accent); }
.quick button.qs[data-on="true"] { color: var(--best); }
.quick:has(.qs:hover) button.qs { color: color-mix(in srgb, var(--best) 75%, #5a5d66); }
.quick button.qs:hover ~ button.qs { color: #5a5d66; }
.quick button.qb { flex: none; width: 30px; display: grid; place-items: center; }
.quick button.qb .dot { background: transparent; border: 1.5px solid #5a5d66; color: #5a5d66; transition: background .12s, color .12s, border-color .12s; }
.quick button.qb:hover .dot { border-color: var(--best); color: var(--best); }
.quick button.qb[data-on="true"] .dot { background: var(--best); border-color: var(--best); color: #2b2205; }
@media (hover: hover) { .card:hover .badge, .card:has(:focus-visible) .badge { opacity: 0; } }
@media (hover: none) { .quick { display: none; } }
.empty { padding: 50px 0; color: var(--muted); max-width: 520px; }
.empty h2 { font: 700 20px var(--f-display); color: var(--fg); margin: 0 0 8px; }

/* ---------- оверлеи ---------- */
.overlay { position: fixed; inset: 0; z-index: 50; background: rgba(6,7,9,.78); backdrop-filter: blur(6px); display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); width: min(980px, 100%); max-height: 100%; overflow: auto; position: relative; }
.close { position: absolute; top: 10px; right: 10px; z-index: 2; border: 0; background: var(--raise); width: 36px; height: 36px; border-radius: 50%; font-size: 18px; color: var(--muted); }
.close:hover { color: var(--fg); }
/* у карточки ✕ не уезжает при прокрутке длинного содержимого (на телефоне подложки, по которой можно нажать, нет) */
#detailSheet > .close { position: sticky; top: 10px; display: block; margin: 10px 10px -46px auto; z-index: 3; box-shadow: 0 2px 10px rgba(0,0,0,.4); }
#achSheet > .close, #cmpSheet > .close { position: sticky; top: 10px; align-self: flex-end; flex: none; margin: -14px -14px -50px 0; z-index: 3; box-shadow: 0 2px 10px rgba(0,0,0,.4); }
.toast .t-act { margin-left: 14px; border: 0; background: none; padding: 0; color: inherit; font: inherit; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
.detail { display: grid; grid-template-columns: minmax(200px, 300px) 1fr; gap: 28px; padding: 28px; }
.detail .d-title { padding-right: 40px; }
/* карточка: сначала что это и сразу отметки — найденное отмечается без прокрутки; подробности ниже */
.d-head { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.d-head .d-orig { margin-top: -6px; }
.d-body { min-width: 0; display: flex; flex-direction: column; gap: 16px; }
.frames { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.frames button { border: 0; padding: 0; background: var(--raise); border-radius: 4px; overflow: hidden; aspect-ratio: 16 / 9; max-width: 100%; }
.frames img { width: 100%; height: 100%; object-fit: cover; display: block; }
.frame-big { width: 100%; border-radius: 6px; display: block; }
/* листы из хранилища артефакта: афиша — ячейка 6×4, кадр — треть полоски; режутся фоном, без перекодирования */
.poster .sp { position: absolute; inset: 0; z-index: 1; background-repeat: no-repeat; background-size: 600% 400%; }
.fsp { display: block; width: 100%; height: 100%; background-repeat: no-repeat; background-size: 300% 800%; }
.frame-big.fsp { aspect-ratio: 16 / 9; height: auto; }
.mrows { display: flex; flex-direction: column; gap: 10px; align-items: stretch; }
.mrow { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 10px; align-items: center; }
.mrow > span { font: 500 11px var(--f-data); color: var(--dim); text-transform: uppercase; letter-spacing: .06em; }
.mrow.off { opacity: .45; }
.mrows .reset { align-self: flex-start; padding-left: 0; }
.marks { display: grid; gap: 6px; }
.marks.c2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.marks.c3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.mbtn:disabled { opacity: .5; cursor: default; }
.again-tag { position: absolute; z-index: 2; top: 8px; left: 8px; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; background: rgba(14,15,18,.82); color: var(--accent); border: 1.5px solid var(--accent); }
.mbtn { border: 1px solid var(--line); background: var(--bg); border-radius: var(--r); padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); min-width: 0; text-align: center; }
.mbtn:hover { border-color: var(--muted); color: var(--fg); }
.mbtn[aria-pressed="true"] { color: var(--fg); border-color: var(--fg); background: var(--raise); }
.note textarea { width: 100%; min-height: 64px; resize: vertical; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r); padding: 9px 11px; }
.note label { font: 500 11px var(--f-data); color: var(--dim); text-transform: uppercase; letter-spacing: .06em; display: block; margin-bottom: 4px; }
.d-nav { display: flex; justify-content: space-between; gap: 8px; padding: 0 28px 22px; }
.d-nav button { border: 1px solid var(--line); background: none; border-radius: var(--r); padding: 8px 14px; color: var(--muted); }
.d-nav button:hover:not(:disabled) { color: var(--fg); border-color: var(--muted); }
.d-nav button:disabled { opacity: .35; cursor: default; }
.inbox { width: min(560px, 100%); padding: 26px; display: flex; flex-direction: column; gap: 14px; }
.inbox h2 { margin: 0; font: 700 20px var(--f-display); padding-right: 40px; }
.inbox p { margin: 0; color: var(--muted); }
.inbox textarea { width: 100%; min-height: 110px; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; resize: vertical; }
.inbox .row { justify-content: space-between; }
.inbox .send { border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 600; border-radius: var(--r); padding: 10px 18px; }
.inbox .send:disabled { opacity: .5; cursor: default; }
.pending { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; max-height: 240px; overflow: auto; }
.pending li { display: flex; justify-content: space-between; gap: 10px; align-items: center; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r); padding: 7px 8px 7px 12px; }
.pending li span { min-width: 0; overflow-wrap: anywhere; }
.pending li small { color: var(--dim); font: 500 12px var(--f-data); margin-left: 6px; }
.pending li button { border: 0; background: none; color: var(--dim); font-size: 16px; padding: 2px 6px; }
.pending li button:hover { color: var(--liked); }
/* поиск по всему каталогу: окно у верха, чтобы не прыгало от числа найденного */
.find-btn { display: inline-flex; align-items: center; gap: 6px; }
.find-btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; }
#ovFind { place-items: start center; }
.find { width: min(640px, 100%); margin-top: 7vh; max-height: 86%; padding: 22px 22px 14px; display: flex; flex-direction: column; gap: 12px; overflow: hidden; }
.find h2 { margin: 0; font: 700 20px var(--f-display); padding-right: 40px; }
.find .search { flex: none; }
.find .search input { font-size: 16px; padding-block: 10px; }
.find-out { min-height: 0; overflow: auto; margin-inline: -8px; padding-inline: 8px; }
.find-out p { margin: 6px 0; color: var(--muted); }
.find-out .send { border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 600; border-radius: var(--r); padding: 10px 16px; margin-top: 6px; }
.found { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.hit { width: 100%; display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 12px; align-items: center; text-align: left; border: 1px solid transparent; background: none; border-radius: var(--r); padding: 6px 8px; }
.hit:hover, .hit:focus-visible { background: var(--raise); border-color: var(--line); outline: none; }
.hit .poster { width: 44px; border-radius: 4px; }
.hit .ph { padding: 4px; }
.hit .ph b { font-size: 8px; } .hit .ph i { display: none; }
.hit .t { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hit .m { display: block; color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hit .dot.pill { font-size: 11px; }
.find-more { color: var(--dim); font-size: 13px; padding: 8px 8px 2px; }

.notice { margin-top: 12px; padding: 9px 12px; border: 1px solid var(--line); border-radius: var(--r); color: var(--muted); font-size: 14px; background: var(--panel); }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); translate: -50% 0; z-index: 60; background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: var(--r); font-weight: 500; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
footer.foot { border-top: 1px solid var(--line); color: var(--dim); font-size: 13px; }
footer.foot .wrap { padding-block: 18px 28px; display: flex; flex-wrap: wrap; gap: 6px 18px; justify-content: space-between; }

/* ---------- ширины (по блоку .app, а не по окну) ---------- */
@container app (max-width: 1100px) {
  .h-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@container app (max-width: 980px) {
  .modes { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
/* окно на пол-экрана: все пять вкладок шапки должны помещаться целиком (23.10 при 900 px «Моё» уезжало за край,
   «Пересмотреть» обрезалось) — «Найти» и «Добавить» без подписи, вкладки плотнее, у самых узких — без числа у «Моё» */
@container app (min-width: 761px) and (max-width: 1080px) {
  .top .wrap { gap: 10px; }
  .vtab { padding: 8px 10px; }
  #openInbox .lbl, #openFind .lbl { display: none; }
}
@container app (min-width: 761px) and (max-width: 860px) {
  .vtab b { display: none; }
}
/* средняя ширина: описание уходит под афишу и панель */
@container app (min-width: 761px) and (max-width: 1120px) {
  .rc { grid-template-columns: var(--pw) 400px; }
  .rc-info { grid-column: 1 / -1; }
}
@container app (max-width: 760px) {
  .top .wrap { gap: 10px; }
  .mark-word { font-size: 17px; margin-right: auto; }
  /* на телефоне вкладок нет: профиль — точка входа, в разделах — «‹ Профиль» и название раздела */
  .views { display: none; }
  .app:not([data-screen="home"]) .mark-word { display: none; }
  .app:not([data-screen="home"]) .back-home { display: inline-flex; }
  .app:not([data-screen="home"]) .ptitle { display: block; }
  #openInbox .lbl, #openFind .lbl { display: none; }
  #openInbox { padding: 7px 12px; font-size: 16px; line-height: 1.1; }
  #openFind { padding: 8px 11px; }
  #openFind svg { width: 17px; height: 17px; }
  .find { margin-top: 0; max-height: none; padding: 16px 16px 8px; }
  .home { padding-block: 18px 36px; gap: 24px; }
  .h-lead { font-size: 15px; }
  .h-hero { gap: 12px; }
  .h-hero h1 { font-size: 30px; }
  /* итог на телефоне: «отмечено» строкой сверху, остальные четыре — одной строкой под ним */
  .h-stats { grid-template-columns: minmax(0, 1fr); border-radius: 12px; }
  .h-stat { padding: 9px 10px 8px; gap: 2px; }
  .h-stat b { font-size: 19px; }
  .h-stat span { font-size: 11.5px; }
  .h-stat.main { flex-direction: row; align-items: baseline; gap: 8px; padding: 10px 12px; }
  .h-stat.main b { font-size: 24px; }
  .h-stat.main span { font-size: 13px; }
  .modes { gap: 8px; }
  .mode { min-height: 122px; padding: 14px 14px 12px; border-radius: 14px; gap: 6px; }
  .mode b { font-size: 16px; }
  .mode small { font-size: 12.5px; }
  .mode .m-ico { width: 30px; height: 30px; font-size: 14px; }
  .mode .m-bg { font-size: 92px; bottom: -20px; }
  .h-grid { grid-template-columns: minmax(0, 1fr); }
  .h-wide { grid-column: auto; }
  .cols { height: 150px; gap: 2px; }
  .cols .k { font-size: 10px; letter-spacing: -.02em; }
  .stat4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .strip { grid-auto-columns: 96px; }
  .summary { display: none; }   /* «Моё» уже написано в шапке рядом с «‹ Профиль» */
  .ms.full { grid-auto-columns: 76px; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; }
  .ms .dot2 { min-width: 30px; padding: 0 4px; font-size: 11px; }
  .ach-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .ach { flex-direction: column; align-items: flex-start; padding: 10px; gap: 8px; }
  .ach .medal { min-width: 36px; height: 36px; font-size: 12px; }
  .ach-t { width: 100%; }
  .ms:not(.full) small { display: none; }
  .coll-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .coll-open { padding: 10px 10px 11px; }
  .coll-name { font-size: 14px; padding-right: 22px; }
  .sub-star { top: 3px; right: 3px; }
  .ms small { font-size: 11px; }
  .ach-sheet { padding: 18px 16px 24px; }
  .cmp-home { grid-template-columns: minmax(0, 1fr); }
  .coll-items { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 14px 10px; }
  .flag { min-height: 40px; }
  .chip, .gsel select { min-height: 36px; }
  /* цели под палец — не меньше ~40 px (разбор 23.10): жанры у карточки, «Снять отметку», «‹ Профиль», «+», ✕ заявки */
  .rc-genres button { min-height: 36px; padding: 6px 12px; font-size: 14px; }
  .reset, .back-home, #openInbox, #openFind { min-height: 40px; }
  .pending li button { min-width: 40px; min-height: 40px; }
  /* шрифт полей ввода 16 px: меньше — и iPhone увеличивает страницу при нажатии на поле */
  input, select, textarea, .gsel select { font-size: 16px; }
  .rc-top { padding-block: 12px 10px; flex-wrap: nowrap; gap: 8px; }
  /* На телефоне раздел и жанр — два одинаковых списка в одну строку (24.10, «а не лучше ли разделы запихнуть в
     раскрывающийся список, как жанры? — на телефонной вёрстке»). Ряд кнопок разделов сюда не помещался: листался вбок,
     и выбранные «Сериалы» прятали «Всё» и «Фильмы» за левым краем без намёка («как мне выбрать фильмы?»).
     На широком экране — кнопки, там места хватает. Ширина списков постоянная — по половине строки: иначе после выбора
     «Сверхъестественное» соседний список уезжал бы. */
  .rc-secs { display: none; }
  .gsel.rc-secsel { display: inline-flex; }
  .gsel { flex: 1 1 0; min-width: 0; }
  .gsel::before { display: none; }
  .gsel select { field-sizing: fixed; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rc { grid-template-columns: 1fr; gap: 18px; }
  .rc-col { width: 100%; }
  .rc { --ph: 330px; --pw: 220px; }
  .rc-mtitle { display: block; }
  .rc-info .d-title, .rc-info .d-orig { display: none; }   /* названия уже над афишей */
  /* на телефоне панель ответа прибита к низу экрана — под большой палец, афиша и описание прокручиваются над ней */
  #vDeck { padding-bottom: calc(250px + env(safe-area-inset-bottom, 0px)); }
  #vDeck.msg { padding-bottom: 0; }
  .rc-panel { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; gap: 8px; background: color-mix(in srgb, var(--panel) 96%, transparent);
    backdrop-filter: blur(10px); border-top: 1px solid var(--line); box-shadow: 0 -10px 30px rgba(0,0,0,.35);
    padding: 8px max(12px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
  .rc-last { display: none; }
  .opt { min-height: 72px; font-size: 16px; }
  .opt.sub { min-height: 52px; font-size: 15px; }
  .opt.col { font-size: 14px; }
  .ans.c5 .opt { min-height: 66px; }
  .ans.c5 .opt.wide { min-height: 50px; }
  .opt.rs b { font-size: 18px; }
  .opt.rs small { font-size: 11px; }
  .act-minor button { min-height: 40px; padding-block: 6px; }
  .rc-msg { padding-block: 24px 40px; }
  .chips.status { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px))); padding-right: 16px; }
  .chips.status::-webkit-scrollbar { display: none; }
  .toggle-filters { display: inline-block; }
  .filters:not(.open) .more-filters { display: none; }
  .search { flex: 1 1 100%; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 16px 10px; }
  .card .t { font-size: 12.5px; letter-spacing: -.01em; }
  /* на телефоне афиша маленькая слева от названия, отметки сразу под ними — всё на первом экране */
  .detail { grid-template-columns: 104px minmax(0, 1fr); padding: 16px; gap: 16px 14px; }
  .detail .d-body { display: contents; }
  .detail .d-poster { grid-column: 1; grid-row: 1; }
  .detail .d-head { grid-column: 2; grid-row: 1; align-self: center; gap: 8px; }
  .detail .d-head .d-orig { margin-top: -4px; font-size: 14px; }
  .detail .d-body > :not(.d-head) { grid-column: 1 / -1; }
  .detail .d-title { font-size: 21px; padding-right: 34px; }
  .detail .poster { width: 100%; }
  .mrow { grid-template-columns: 1fr; gap: 6px; }
  .mbtn { min-height: 48px; flex-direction: row; justify-content: center; font-size: 14px; }
  .d-nav { padding: 0 18px 18px; }
  .overlay { place-items: stretch; padding: env(safe-area-inset-top, 0px) 0 0; }
  .sheet { border-radius: 0; border: 0; width: 100%; height: 100%; }
  .next kbd, .act-minor kbd, .opt kbd, .msg-acts kbd { display: none; }
}
@media (hover: none) { .next kbd, .act-minor kbd, .opt kbd, .msg-acts kbd { display: none; } .strip { scrollbar-width: none; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<!-- вид телефона: подпись и переключатель над рамкой (сама рамка — .device) -->
<div class="devbar" id="devbar">
  <span>Так это выглядит на телефоне · 390 × 844</span>
  <div class="seg2" role="group" aria-label="Вид">
    <button type="button" data-dev="desk"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M9 20h6M12 16v4"/></svg>Компьютер</button>
    <button type="button" data-dev="phone"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M11 18.5h2"/></svg>Телефон</button>
  </div>
</div>

<div class="stage"><div class="device" id="device"><div class="scroller" id="scroller">
<div class="app" id="app" data-screen="home" lang="ru">
<header class="top">
  <div class="wrap">
    <button class="back-home" type="button" data-view="home" aria-label="В профиль">‹ Профиль</button>

const titles = (n) => `${n} ${plural(n, "название", "названия", "названий")}`;

const byId = new Map();
const relOf = new Map();        // id -> Set соседних частей (в обе стороны)
const marks = new Map();        // id -> документ отметки
let inbox = [];
const saved = lsGet("spiski.view2", {});
const mine = { sec: saved.sec || "films", status: saved.status || "seenAny", decades: new Set(), country: "", genre: "", kind: "", sort: saved.sort || "recent", q: "" };
let viewName = "home";
let visible = [];
let store = { mode: "loading", canWrite: false };
// сайт для друзей: публичная копия на GitHub Pages ставит window.SPISKI_SITE = {db: "<адрес Firebase>"} до этого скрипта
const SITE = window.SPISKI_SITE || null;
const CLOUD = SITE && SITE.db ? String(SITE.db).replace(/\/+$/, "") : null;
let syncCode = null;
try { syncCode = CLOUD ? JSON.parse(localStorage.getItem("spiski.sync") || "null") : null; } catch {}

// ---------- хранилище отметок ----------
let db = null;
const pending = new Map(), running = new Set();

// первая карточка подбирается, только когда пришли прошлые отметки — иначе подбор начнёт с нуля
let ready = false, loadFailed = false;
function storeReady() { if (ready) return; ready = true; refreshDetailMarks(); if (MODES[viewName]) startDeck(viewName); else marksChanged(); }
// Отмечать можно, только когда прошлые отметки дочитаны целиком: документ пишется целиком, и 4★ по ещё не пришедшему
// документу затёрли бы его «любимое», заметку и «пересмотреть» (разбор 23.10). Не дочитались — только просмотр.
const canMark = () => store.canWrite && ready && !loadFailed;

let markPath = "marks", userCap = null, myId = null;

function goLocal(personal) {

  if (SITE) {

  }

    // в браузере. Владельцу — только просмотр: иначе при сбое его отметки молча ушли бы в браузер мимо базы.

  }

  // часть его «не смотрел» не загружалась, и эти фильмы предлагались снова). Поэтому при открытии ВСЕ отметки

  // каждая запись ставит u (время записи), так видно и отмеченное на другом устройстве.
  const since = Date.now() - 60000;       // запас на расхождение часов устройств
  try { await loadAllMarks(); }
  catch (e) {
    // по неполным отметкам подбор предложит уже отмеченное, а ответ затрёт документ — поэтому до перезагрузки только просмотр

  }
  storeReady(); marksChanged();
  // Окно подписки — 1000 самых свежих записей (orderBy u desc): новая запись всегда в него попадает. «removed» у
  // ограниченного запроса значит и «удалён», и «вытолкнут из окна» — неотличимо. 22.10 страница верила ему на слово:
  // после тысячи ответов за заход старые отметки вылетали из окна, стирались у себя, и фильмы предлагались снова.
  // Поэтому на «removed» документ перечитывается, и отметка забывается, только если его в базе правда нет.
  db.collection(markPath).where("u", ">=", since).orderBy("u", "desc").limit(1000).onSnapshot(snap => {
    for (const ch of snap.docChanges()) {
      const id = ch.doc.id;
      if (running.has(id) || pending.has(id)) continue;      // своя запись ещё в пути — у нас уже свежее
      if (ch.type === "removed") forgetIfDeleted(id); else marks.set(id, { ...ch.doc.data() });
    }
    marksChanged();
  }, err => showNotice("Отметки с других устройств не обновляются: " + err.message));
}
async function forgetIfDeleted(id) {

// ---------- карточка (оверлей) ----------
let detailId = null, detailList = null;
function starsHtml(r, attr, dis) {
  let h = `<div class="stars" role="group" aria-label="Оценка">`;
  for (let n = 1; n <= 5; n++) h += `<button class="star" type="button" ${attr}="r:${n}" aria-pressed="${!!r && n <= r}" aria-label="${n} из 5 — ${STAR_WORD[n]}" title="${n} — ${STAR_WORD[n]}" ${dis}>★</button>`;
  return h + `<span class="slabel">${r ? STAR_WORD[r] : ""}</span></div>`;
}
// «Любимое» всегда первым, второе — «хочу посмотреть» у непросмотренного или «хочу пересмотреть / досмотреть» у
// просмотренного: кнопки не меняются местами (раньше после «Любимого» на его место вставало «Пересмотреть»).
// Любимое сразу значит «смотрел»: найденное поиском отмечается одним нажатием.
function flagsHtml(it, v, attr, dis) {
  const f = (key, label, on) => `<button class="flag" type="button" ${attr}="${key}" aria-pressed="${on}" ${dis}>${label}</button>`;
  const w = watchedV(v);
  return f("best", "★ Любимое", w && !!v.best) + f("again", w ? "↻ " + AGAIN[v.seen].btn : "+ " + AGAIN.no.btn, v.w === true);
}
// в карточке всё сразу: смотрел ли, звёзды, любимое и «пересмотреть» — поправить любое одним нажатием
function markButtons(id) {
  const it = byId.get(id), v = viewOf(id) || {};
  const dis = canMark() ? "" : "disabled";
  const b = (val, label, dot, icon, on) => `<button class="mbtn" type="button" data-mark="${val}" aria-pressed="${on}" ${dis}><i class="dot" data-s="${dot}">${icon}</i>${label}</button>`;
  const seenRow = ["no", "yes", ...(isSeries(it) ? ["part"] : [])].map(s => b("seen:" + s, SEEN_OPT[s].short || SEEN_OPT[s].name, SEEN_OPT[s].dot, SEEN_OPT[s].icon, v.seen === s)).join("");
  const watched = watchedV(v);
  // все строки видны сразу и у неотмеченного: звезда или «любимое» сами ставят «смотрел»
  return `<div class="mrows">
    <div class="mrow"><span>Смотрел?</span><div class="marks c${isSeries(it) ? 3 : 2}">${seenRow}</div></div>
    <div class="mrow${v.seen === "no" ? " off" : ""}"><span>Оценка</span>${starsHtml(watched ? v.r : null, "data-mark", dis)}</div>
    <div class="mrow"><span>Списки</span><div class="flags">${flagsHtml(it, v, "data-mark", dis)}</div></div>
    ${v.seen ? `<button class="reset" type="button" data-mark="clear">Снять отметку</button>` : ""}
  </div>`;
}
// Общая правка отметки — карточка и быстрые кнопки на полке.
// Повторное нажатие той же кнопки сразу после первого отменяет промах — отметка возвращается такой, какой была до
// первого нажатия: 3★ → «Любимое» → «Любимое» = снова 3★ (а не 5★); неотмеченное → «Хочу посмотреть» → ещё раз =
// снова без отметки (а не «не смотрел»). Снятие давнего «Любимого» по-прежнему даёт 5★ (его правило 23.10).
// Если правка стёрла звёзды, «хочу…» или всю отметку — внизу «Вернуть» (разбор 23.10: «Не смотрел» рядом с первой
// звездой и «Снять отметку» стирали всё без возврата).
const TOGGLES = new Set(["best", "again", "no"]);
let lastTap = null;   // {id, a, before, u, at}
function applyMark(id, a) {
  const before = marks.has(id) ? { ...marks.get(id) } : null;
  if (TOGGLES.has(a) && lastTap && lastTap.id === id && lastTap.a === a && (marks.get(id) || {}).u === lastTap.u && Date.now() - lastTap.at < 20000) {
    const doc = lastTap.before; lastTap = null;
    $("toast").hidden = true;   // «Вернуть» от первого нажатия уже не нужно
    restoreMark(id, doc);
    return true;
  }
  if (!markRaw(id, a)) return false;
  lastTap = TOGGLES.has(a) ? { id, a, before, u: (marks.get(id) || {}).u, at: Date.now() } : null;
  offerUndo(id, a, before);
  return true;
}
function offerUndo(id, a, before) {
  if (!before) return;
  const vb = viewDoc(before), va = viewOf(id);
  const lost = (vb.seen && !(va && va.seen)) || (vb.r && !(va && va.r)) || (a !== "again" && vb.w === true && !(va && va.w === true));
  if (!lost) return;
  const it = byId.get(id);
  toast(`«${it.title}»: ${va && va.seen ? summaryOf(id) : "отметка снята"}`, { label: "Вернуть", run: () => restoreMark(id, before) });
}
function markRaw(id, a) {
  const v = viewOf(id) || {};
  const [kind, val] = a.split(":");
  if (kind === "no") return setState(id, v.seen === "no" ? { seen: null } : { seen: "no" });
  // Звезда ставит ровно эту оценку и ничего не стирает: с 3 на 4 — одно нажатие (23.10: «сейчас клик на звезды снимает
  // оценку» — повторное нажатие той же звезды стирало её, а у любимого пятая звезда стирала всё). У любимого любая
  // звезда снимает «любимое»: пятая оставляет пять звёзд. Снятое «Любимое» — тоже пять звёзд.
  if (kind === "r") {
    const n = +val;
    if (!v.best && v.r === n) return false;
    return setState(id, { r: n, best: false, seen: watchedV(v) ? v.seen : "yes" }, watchedV(v));
  }
  if (kind === "best") return setState(id, v.best ? { best: false, r: 5 } : { best: true, seen: watchedV(v) ? v.seen : "yes" }, watchedV(v));
  if (kind === "again") return setState(id, { w: v.w === true ? null : true, seen: v.seen || "no" }, true);
  if (kind === "seen") return v.seen !== val && setState(id, { seen: val });
  if (kind === "clear") return setState(id, { seen: null });
  return false;
}
// перерисовать только блок отметок, чтобы не сбивать заметку и кадры; фокус — на той же кнопке (отмечали с клавиатуры)
function refreshDetailMarks() {

  const sh = $("detailSheet"), box = sh.querySelector(".mrows"); if (!box) return;

  if (f) { const b = sh.querySelector(`.mrows [data-mark="${f}"]`); if (b) b.focus({ preventScroll: true }); }
  const note = $("noteInput"); if (note) note.disabled = !canMark();
}

  sh.querySelector(".d-poster").appendChild(posterEl(it, true));
  framesOf(it).then(list2 => {

    box.onclick = (e) => {

  note.addEventListener("input", () => { clearTimeout(t); t = setTimeout(saveNote, 700); });

$("detailSheet").addEventListener("click", (e) => {
  if (e.target.closest(".close")) return hideOverlay("ovDetail");
